# GAIA-X identity hosting. Settings come from .env (copy .env.example).
#
#   nginx (always)        serves static/ on 127.0.0.1:8080.
#   caddy (profile caddy) automatic HTTPS via Let's Encrypt on ports 80/443.
#       Enable with COMPOSE_PROFILES=caddy in .env. Leave it off if another reverse
#       proxy (Traefik, another nginx, a load balancer) already terminates HTTPS.
#       The did:web spec requires HTTPS — plain HTTP only works on localhost.
#   gx    (profile tools) the automation tool; never starts with `up`, run it with
#       docker compose run --rm gx status | gx run -i     (see automation/README.md)
#
# NOTE — two certificates are involved, do not confuse them:
#   * the WEB SERVER TLS certificate (Caddy's, or your proxy's). Let's Encrypt is fine here,
#     in production too. It only secures the HTTPS connection.
#   * the IDENTITY certificate, served as static/cert.pem and referenced by x5u in did.json.
#     This one signs your credentials and must be EV SSL in production (an eIDAS QTSP can
#     issue one — see gaia-x-onboarding.md Step 1). In dev, Caddy's certificate is reused
#     as the identity certificate.
#
# This file is identical in dev and production; only static/ contents and the GXDCH
# endpoints you talk to change.

services:

  # ── nginx static file server (HTTP only) ─────────────────────────────────────
  gaia-x-hosting:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # bind to localhost only; Caddy (or your proxy) talks to it
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
    # Hardening — the container only serves static files, so it needs no
    # extra privileges and no writable root filesystem.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # ── Caddy reverse proxy with automatic HTTPS ─────────────────────────────────
  # Prerequisite: ports 80 and 443 reachable from the internet (ACME HTTP-01).
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GX_DOMAIN: ${GX_DOMAIN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificate + key — persist this volume
      - caddy_config:/config
    depends_on:
      - gaia-x-hosting

  # ── gx automation tool (on demand only) ──────────────────────────────────────
  gx:
    build: ./automation
    profiles: ["tools"]
    environment:
      GX_ENV: ${GX_ENV:-dev}
      GX_DOMAIN: ${GX_DOMAIN:-}
    volumes:
      - ./static:/repo/static                          # the only place gx writes to
      - ./automation/config:/repo/automation/config:ro
      - caddy_data:/caddy-data:ro                      # dev: Caddy's certificate and key
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
