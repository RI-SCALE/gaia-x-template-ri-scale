# GAIA-X identity hosting. Settings come from .env (copy .env.example).
# Which services run is chosen in .env - see automation/README.md, "Choose your setup".
#
#   gaia-x-hosting (always)  nginx; serves static/ on 127.0.0.1:8080.
#   caddy   (profile caddy)  automatic HTTPS via Let's Encrypt on ports 80/443. Leave it
#                            off if another reverse proxy already terminates HTTPS here.
#                            The did:web spec requires HTTPS.
#   openbao (profile vault)  holds the identity key (setup A). Reachable only on the
#                            internal network "vault"; locked after every restart.
#   gx, openbao-admin (profile tools)  run on demand, never by `up`:
#                            docker compose run --rm gx status
#                            automation/openbao/admin.sh ...
#
# Two certificates are involved, do not confuse them:
#   * the WEB SERVER certificate (Caddy's, or your proxy's): only secures HTTPS.
#   * the IDENTITY certificate, served as static/cert.pem and named in did.json. Its key
#     signs the credentials. Setup A: your organisation's certificate, key in OpenBao.
#     Setup B (compose.letsencrypt.yml): Caddy's certificate doubles as the identity.

services:

  # ── nginx static file server (HTTP only) ─────────────────────────────────────
  gaia-x-hosting:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # bind to localhost only; Caddy (or your proxy) talks to it
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
    # Hardening — the container only serves static files, so it needs no
    # extra privileges and no writable root filesystem.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # ── Caddy reverse proxy with automatic HTTPS ─────────────────────────────────
  # Prerequisite: ports 80 and 443 reachable from the internet (ACME HTTP-01).
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GX_DOMAIN: ${GX_DOMAIN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificate + key — persist this volume
      - caddy_config:/config
    depends_on:
      - gaia-x-hosting

  # ── OpenBao: the identity key (setup A) ──────────────────────────────────────
  # No published port: only gx and openbao-admin reach it, over the internal network.
  # After a restart it is sealed until `automation/openbao/admin.sh unseal`.
  openbao:
    image: openbao/openbao:2.7.1
    profiles: ["vault"]
    restart: unless-stopped
    command: server
    volumes:
      - ./automation/openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao_data:/openbao/file   # encrypted key store - back it up with the unseal key
    networks:
      - vault
    security_opt:
      - no-new-privileges:true

  # Admin tool for the key (OpenBao CLI + openssl); used only via automation/openbao/admin.sh.
  openbao-admin:
    build: ./automation/openbao
    profiles: ["tools"]
    environment:
      BAO_ADDR: http://openbao:8200
      GX_DOMAIN: ${GX_DOMAIN:-}
    volumes:
      - ./certs:/certs              # writes the public chain
      - ./secrets:/secrets          # writes gx's sign-only token
    tmpfs:
      - /work:mode=0700             # the only place key material ever is, in RAM
    networks:
      - vault                       # internal only: no internet access

  # ── gx automation tool (on demand only) ──────────────────────────────────────
  # Setup A: never sees a private key - it only asks OpenBao to sign.
  # Setup B: compose.letsencrypt.yml adds Caddy's certificate storage.
  gx:
    build: ./automation
    profiles: ["tools"]
    environment:
      GX_ENV: ${GX_ENV:-dev}
      GX_DOMAIN: ${GX_DOMAIN:-}
    volumes:
      - ./static:/repo/static                          # the only place gx writes to
      - ./automation/config:/repo/automation/config:ro
      - ./certs:/repo/certs:ro                         # public identity chain (setup A)
      - ./secrets:/run/secrets/gx:ro                   # sign-only OpenBao token (setup A)
    networks:
      - default                                        # internet: Gaia-X services
      - vault                                          # OpenBao
    security_opt:
      - no-new-privileges:true

networks:
  vault:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  openbao_data:
