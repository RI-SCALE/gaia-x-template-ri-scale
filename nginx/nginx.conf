server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Don't leak the nginx version in responses / error pages.
    server_tokens off;

    # DID document — must be served with correct Content-Type and CORS header
    # so that DID resolvers (GXDCH, browsers) can fetch it cross-origin.
    location = /.well-known/did.json {
        add_header Content-Type "application/json";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Certificate chain — fetched via x5u during VC signature verification
    location = /cert.pem {
        add_header Content-Type "application/x-pem-file";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Compliance VC — publicly resolvable URL pushed to GAIA-X CES
    location = /gaia-x/compliance-vc.json {
        add_header Content-Type "application/json";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Block directory listing everywhere
    autoindex off;
}
