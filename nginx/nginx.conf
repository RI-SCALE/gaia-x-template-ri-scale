server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Don't leak the nginx version in responses / error pages.
    server_tokens off;
    autoindex off;
    charset utf-8;

    # ── CORS and security headers ─────────────────────────────────────────────
    # DID resolvers, the GAIA-X Wizard and the GXDCH Compliance Service fetch these
    # files cross-origin from a browser, so Access-Control-Allow-Origin is mandatory.
    #
    # IMPORTANT: add_header is NOT inherited into a location block that declares its
    # own add_header — nginx replaces the whole set. Keep every add_header here at
    # server level so it applies to all six files (and to error responses).
    add_header Access-Control-Allow-Origin  "*"                 always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Max-Age       "86400"             always;
    add_header X-Content-Type-Options       "nosniff"           always;

    # ── Content types ─────────────────────────────────────────────────────────
    # Set via the type map, never via `add_header Content-Type` — that emits a
    # DUPLICATE Content-Type header, which some strict clients reject.
    #
    #   .json  did.json, and a Compliance VC saved in JSON form
    #   .jwt   enveloped VC-JWT credentials (LRN, Legal Person, T&C, Compliance VC)
    #   .pem   the X.509 identity certificate chain referenced by x5u
    types {
        application/json        json;
        application/jwt         jwt;
        application/x-pem-file  pem;
    }
    default_type application/octet-stream;

    # Answer CORS preflight cheaply (headers above are attached by `always`).
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── The files GAIA-X must be able to fetch ────────────────────────────────

    # Identity anchor — resolved first by every verifier.
    location = /.well-known/did.json {
        try_files $uri =404;
    }

    # Trust anchor — must match the x5u value inside did.json.
    # Production: the EV SSL identity certificate (NOT the web server's TLS cert).
    # Must be the full chain ending in a self-signed root.
    location = /cert.pem {
        try_files $uri =404;
    }

    # Verifiable Credentials. Every VC is fetched at the exact `vcId` URL that was
    # baked into its signature, so these paths must never change once signed:
    #
    #   /gaia-x/lrn.jwt              Legal Registration Number VC (Notary-signed)
    #   /gaia-x/legal-person.jwt     Legal Person VC              (self-signed)
    #   /gaia-x/tandc.jwt            Terms & Conditions VC        (self-signed)
    #   /gaia-x/compliance-vc.jwt    Compliance VC from the GXDCH (the HTTP response body)
    #
    # A prefix match is used deliberately: any file under /gaia-x/ is served with the
    # right type, so a Wizard-downloaded JSON copy (compliance-vc.json) or extra
    # credentials added later (service offerings, data products) need no config change.
    location ^~ /gaia-x/ {
        try_files $uri =404;
    }

    # Nothing else is published from this host.
    location / {
        return 404;
    }
}
